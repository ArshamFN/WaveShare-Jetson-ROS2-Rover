# ============================================================================
# nav2_params.yaml — Waveshare UGV02 / Jetson Orin Nano
# Session 013. Architecture "A": slam_toolbox runs live and owns map->odom.
# No map_server, no AMCL.
#
# Every kinematic value below is MEASURED, not assumed:
#   MAX_WHEEL_SPEED   0.956 m/s   (LiDAR wall ranging, +3.2% error)
#   acceleration      0.648 m/s^2 (measured; the COMMANDED ramp is 0.8 and
#                                  the motors cannot follow it)
#   deceleration     -0.699 m/s^2 (measured)
#   track width       0.174 m     (contact patch to contact patch)
#   chassis           0.250 x 0.227 m
# ============================================================================

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0        # matches the 10 Hz scan/odom pipeline
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15         # generous: RF2O + 9% angular slip
      yaw_goal_tolerance: 0.30
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.22        # well under the 0.956 ceiling; RF2O
                                      # degrades at speed (Session 013)
      lookahead_dist: 0.4
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.6
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4

      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.35
      regulated_linear_scaling_min_speed: 0.10

      use_rotate_to_heading: true     # diff drive: spin in place, then drive
      rotate_to_heading_min_angle: 0.5
      rotate_to_heading_angular_vel: 0.6
      max_angular_accel: 1.5

      allow_reversing: false
      max_robot_pose_search_dist: 5.0

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.25
      use_astar: false
      allow_unknown: true             # true: slam_toolbox map has unmapped cells

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0         # matches rover_driver's 20 Hz loop
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity:  [0.26,  0.0,  1.0]
    min_velocity:  [-0.26, 0.0, -1.0]
    max_accel:     [0.648, 0.0,  1.5]   # MEASURED, not the commanded 0.8
    max_decel:     [-0.699, 0.0, -1.5]  # MEASURED
    odom_topic: "/odom"
    odom_duration: 0.1

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Measured chassis: 0.250 long x 0.227 wide, base_link centred.
      footprint: "[[0.125, 0.1135], [0.125, -0.1135], [-0.125, -0.1135], [-0.125, 0.1135]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.2
          obstacle_max_range: 8.0
          obstacle_min_range: 0.2      # matches slam_toolbox min_laser_range
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.25         # circumscribed radius is 0.169;
                                       # leaves clearance without blocking doors
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.125, 0.1135], [0.125, -0.1135], [-0.125, -0.1135], [-0.125, 0.1135]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true   # slam_toolbox publishes latched
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.2
          obstacle_max_range: 8.0
          obstacle_min_range: 0.2
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.25
      always_send_full_costmap: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
