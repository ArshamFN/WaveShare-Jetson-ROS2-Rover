# rover-net-watchdog settings.
#
# The watchdog reads /etc/rover-net-watchdog.conf. This file is the template:
# install a copy there and fill in the copy, never this file, so your network
# names stay out of the repository.
#
# List the names NetworkManager knows:
#   nmcli -t -f DEVICE,TYPE device
#   nmcli -t -f NAME,TYPE connection show

# Wi-Fi interface.
IFACE="wlP1p1s0"

# NetworkManager connection for your home Wi-Fi. NetworkManager names it after
# the Wi-Fi network unless it was renamed.
HOME_CON="[Home Wi-Fi name here]"

# NetworkManager connection for the rover's own network.
AP_CON="rover-ap"
